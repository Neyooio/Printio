<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Upload Files</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f;
      --surface: #14141f;
      --surface-2: #1c1c2e;
      --border: #2a2a40;
      --text: #e8e8f0;
      --text-dim: #8888a0;
      --accent: #6c5ce7;
      --accent-glow: rgba(108,92,231,0.3);
      --success: #00d2a0;
      --error: #ff4757;
      --radius: 12px;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f0f0f5;
        --surface: #ffffff;
        --surface-2: #f5f5fa;
        --border: #d8d8e0;
        --text: #1a1a2e;
        --text-dim: #6666880;
        --accent: #6c5ce7;
        --accent-glow: rgba(108,92,231,0.15);
        --success: #00b894;
        --error: #d63031;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      text-align: center;
      padding: 24px 16px 16px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .header h1 span { color: var(--accent); }
    .header p {
      font-size: 13px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      animation: pulse 2s ease-in-out infinite;
    }
    .status-dot.offline { background: var(--error); animation: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .container {
      flex: 1;
      padding: 0 16px 24px;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--surface);
      margin-bottom: 16px;
    }
    .drop-zone:active, .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-glow);
      transform: scale(0.99);
    }
    .drop-zone-icon {
      font-size: 36px;
      margin-bottom: 8px;
      display: block;
    }
    .drop-zone-text {
      font-size: 14px;
      font-weight: 600;
    }
    .drop-zone-sub {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
    }
    .file-input { display: none; }
    .queue { display: flex; flex-direction: column; gap: 8px; }
    .file-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      position: relative;
      overflow: hidden;
    }
    .file-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .file-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      margin-right: 8px;
    }
    .file-size {
      font-size: 11px;
      color: var(--text-dim);
      white-space: nowrap;
    }
    .progress-bar {
      height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent), #a29bfe);
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-fill.done { background: var(--success); }
    .progress-fill.error { background: var(--error); }
    .file-status {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 4px;
      display: flex;
      justify-content: space-between;
    }
    .done-section {
      margin-top: 24px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: center;
      display: none;
    }
    .done-section.visible { display: block; }
    .done-section h3 {
      font-size: 16px;
      color: var(--success);
      margin-bottom: 4px;
    }
    .done-section p {
      font-size: 12px;
      color: var(--text-dim);
    }
    .allowed-types {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      margin-top: 12px;
      padding: 0 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Print<span>io</span></h1>
    <p>Upload your files for printing</p>
    <div class="status-pill">
      <div class="status-dot" id="statusDot"></div>
      <span id="statusText">Connected</span>
    </div>
  </div>

  <div class="container">
    <div class="drop-zone" id="dropZone">
      <span class="drop-zone-icon">📄</span>
      <div class="drop-zone-text">Tap to select files</div>
      <div class="drop-zone-sub">or drag and drop here</div>
    </div>
    <input type="file" class="file-input" id="fileInput" multiple
           accept=".pdf,.docx,.doc,.xlsx,.pptx,.jpg,.jpeg,.png">

    <div class="queue" id="queue"></div>

    <div class="done-section" id="doneSection">
      <h3>✓ Upload Complete</h3>
      <p id="doneText">Your files are ready for printing.</p>
    </div>

    <div class="allowed-types">
      Accepted: PDF, DOCX, DOC, XLSX, PPTX, JPG, PNG — Max 100 MB per file
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      const CHUNK_SIZE = 1024 * 1024; // 1 MB chunks
      const RETRY_DELAY = 2000;
      const ALLOWED = ['.pdf','.docx','.doc','.xlsx','.pptx','.jpg','.jpeg','.png'];

      let sessionId = null;
      const uploadQueue = [];
      let isUploading = false;

      // ── DOM ──
      const dropZone = document.getElementById('dropZone');
      const fileInput = document.getElementById('fileInput');
      const queueEl = document.getElementById('queue');
      const doneSection = document.getElementById('doneSection');
      const doneText = document.getElementById('doneText');
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');

      // ── Session ──
      async function initSession() {
        try {
          const res = await fetch('/api/session');
          const data = await res.json();
          sessionId = data.sessionId;
        } catch (e) {
          console.error('Session init failed:', e);
        }
      }
      initSession();

      // ── Connection status ──
      function updateStatus(online) {
        statusDot.className = 'status-dot' + (online ? '' : ' offline');
        statusText.textContent = online ? 'Connected' : 'Reconnecting...';
      }
      window.addEventListener('online', () => updateStatus(true));
      window.addEventListener('offline', () => updateStatus(false));

      // ── File Selection ──
      dropZone.addEventListener('click', () => fileInput.click());
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(e.dataTransfer.files);
      });
      fileInput.addEventListener('change', (e) => {
        handleFiles(e.target.files);
        e.target.value = '';
      });

      function handleFiles(fileList) {
        for (const file of fileList) {
          const ext = '.' + file.name.split('.').pop().toLowerCase();
          if (!ALLOWED.includes(ext)) {
            addErrorItem(file.name, 'File type not allowed');
            continue;
          }
          if (file.size > 100 * 1024 * 1024) {
            addErrorItem(file.name, 'Exceeds 100 MB limit');
            continue;
          }
          const item = createFileItem(file);
          uploadQueue.push(item);
        }
        processQueue();
      }

      // ── Queue Processing ──
      async function processQueue() {
        if (isUploading) return;
        const item = uploadQueue.shift();
        if (!item) {
          checkAllDone();
          return;
        }
        isUploading = true;
        await uploadFile(item);
        isUploading = false;
        processQueue();
      }

      // ── Upload Logic ──
      async function uploadFile(item) {
        const file = item.file;
        const fileId = file.name + '_' + file.size + '_' + file.lastModified;

        // Check resume offset
        let offset = 0;
        try {
          const res = await fetch('/api/upload-status?fileId=' + encodeURIComponent(fileId), {
            headers: { 'X-Customer-Session': sessionId }
          });
          const data = await res.json();
          offset = data.uploadedBytes || 0;
        } catch (e) { /* start from 0 */ }

        item.uploadedBytes = offset;
        updateProgress(item);

        while (offset < file.size) {
          const end = Math.min(offset + CHUNK_SIZE, file.size);
          const chunk = file.slice(offset, end);
          const buf = await chunk.arrayBuffer();

          let success = false;
          while (!success) {
            try {
              const res = await fetch('/api/upload-chunk', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/octet-stream',
                  'X-File-Id': fileId,
                  'X-Start-Byte': String(offset),
                  'X-Customer-Session': sessionId,
                  'X-File-Name': file.name,
                  'X-File-Size': String(file.size),
                },
                body: buf,
              });

              if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                if (res.status === 413 || res.status === 403) {
                  item.error = err.error || 'Upload rejected';
                  markError(item);
                  return;
                }
                throw new Error(err.error || 'Upload failed');
              }

              const data = await res.json();
              success = true;
              offset = data.uploadedBytes || (offset + buf.byteLength);
              item.uploadedBytes = offset;
              updateProgress(item);

              if (data.status === 'complete') {
                markComplete(item);
                return;
              }
            } catch (e) {
              updateStatus(false);
              setStatusText(item, 'Retrying...');
              await sleep(RETRY_DELAY);
              updateStatus(navigator.onLine);
            }
          }
        }
        markComplete(item);
      }

      // ── UI Helpers ──
      function createFileItem(file) {
        const el = document.createElement('div');
        el.className = 'file-item';
        el.innerHTML = `
          <div class="file-item-top">
            <span class="file-name">${esc(file.name)}</span>
            <span class="file-size">${formatBytes(file.size)}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill"></div></div>
          <div class="file-status"><span class="status-label">Waiting...</span><span class="pct">0%</span></div>
        `;
        queueEl.appendChild(el);
        return { file, el, uploadedBytes: 0, error: null };
      }

      function addErrorItem(name, msg) {
        const el = document.createElement('div');
        el.className = 'file-item';
        el.innerHTML = `
          <div class="file-item-top">
            <span class="file-name">${esc(name)}</span>
          </div>
          <div class="progress-bar"><div class="progress-fill error" style="width:100%"></div></div>
          <div class="file-status"><span class="status-label" style="color:var(--error)">${esc(msg)}</span><span></span></div>
        `;
        queueEl.appendChild(el);
      }

      function updateProgress(item) {
        const pct = Math.round((item.uploadedBytes / item.file.size) * 100);
        const fill = item.el.querySelector('.progress-fill');
        const pctEl = item.el.querySelector('.pct');
        const label = item.el.querySelector('.status-label');
        fill.style.width = pct + '%';
        pctEl.textContent = pct + '%';
        label.textContent = 'Uploading...';
      }

      function markComplete(item) {
        const fill = item.el.querySelector('.progress-fill');
        const label = item.el.querySelector('.status-label');
        const pctEl = item.el.querySelector('.pct');
        fill.style.width = '100%';
        fill.classList.add('done');
        label.textContent = '✓ Complete';
        label.style.color = 'var(--success)';
        pctEl.textContent = '100%';
      }

      function markError(item) {
        const fill = item.el.querySelector('.progress-fill');
        const label = item.el.querySelector('.status-label');
        fill.style.width = '100%';
        fill.classList.add('error');
        label.textContent = item.error;
        label.style.color = 'var(--error)';
      }

      function setStatusText(item, text) {
        item.el.querySelector('.status-label').textContent = text;
      }

      function checkAllDone() {
        const items = queueEl.querySelectorAll('.file-item');
        if (items.length === 0) return;
        const allDone = queueEl.querySelectorAll('.progress-fill.done');
        if (allDone.length > 0 && allDone.length === items.length - queueEl.querySelectorAll('.progress-fill.error').length) {
          doneSection.classList.add('visible');
          doneText.textContent = allDone.length + ' file' + (allDone.length > 1 ? 's' : '') + ' ready for printing.';
        }
      }

      // ── Utilities ──
      function formatBytes(b) {
        if (b < 1024) return b + ' B';
        if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
        return (b / 1048576).toFixed(1) + ' MB';
      }
      function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
      }
      function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    })();
  </script>
</body>
</html>
